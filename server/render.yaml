# Blueprint de Render para el servidor de Loot Arena.
# Ubicación: server/render.yaml. Al crear el Blueprint en Render, pon "Blueprint Path" = server/render.yaml.
# Render resuelve rootDir respecto a la RAÍZ del repo, así que este mismo archivo funciona sin
# cambios si se mueve a la raíz (/render.yaml; en ese caso Render lo detecta solo).
# Los secretos (sync: false) se piden en el panel al crear el Blueprint; nunca se guardan aquí.
services:
  - type: web
    name: loot-arena-cg913
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        value: "0x32B89E29fACa1b1418B5802b6a2C7de71f3AdA2f"
      - key: ALLOWED_ORIGIN
        value: "https://cristiangarcia913.github.io,http://localhost:7777,http://localhost:7778,http://localhost:7779,https://html-classic.itch.zone"
      - key: DROP_CHANCE
        value: "0.6"
      - key: TRUST_PROXY
        value: "1"
      # 1.2: ranking on-chain y recompensas. No son secretos, pero las direcciones aún no existen:
      # se rellenan en el panel de Render tras desplegar los contratos de la 1.2.
      - key: MERCADO_ADDRESS
        value: "0xC02683814b25c4a99998aD359D336b4A15F83E2f"
      - key: RECOMPENSAS_ADDRESS
        value: "0x67436408fe590dA830E783dc20345CccBCDbEE56"
      - key: DEPLOY_BLOCK
        value: "12072405"
      # PORT lo inyecta Render automáticamente; no hace falta definirlo.
