name: Publicar juego en Itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: cristiangarcia913/loot-arena:html5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copiar ABI y direcciones del contrato a web/config
        run: |
          if [ -f web/sync-config.mjs ]; then (cd web && node sync-config.mjs); fi
      - name: Instalar Butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"
      - name: Publicar web/ en ${{ env.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "::error::Falta el secreto BUTLER_API_KEY"; exit 1; fi
          butler -V
          butler push web "$ITCH_TARGET" --userversion "${GITHUB_SHA::7}"
