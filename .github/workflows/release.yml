name: Publicar versión descargable

# Al subir una etiqueta vX.Y.Z se compilan los ejecutables (Windows, macOS, Linux)
# y el zip HTML5 (para itch.io / Game Jolt) y se adjuntan a una Release de GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta existente (p. ej. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  ejecutables:
    strategy:
      # Si un sistema falla o se cancela, los demás siguen y se publican igual.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: LootArena-Windows.zip
          # macos-latest (arm64) no consiguió runner en v1.1.0 por falta de
          # capacidad y macos-14 ya no está soportado. El runner Intel tiene su
          # propia cola; el binario x64 funciona en Apple Silicon con Rosetta 2.
          - os: macos-15-intel
            nombre: LootArena-macOS.zip
          - os: ubuntu-latest
            nombre: LootArena-Linux.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Al relanzar a mano, compila la etiqueta pedida (no main).
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sincronizar ABI y direcciones
        run: node web/sync-config.mjs
      - name: Compilar ejecutable
        run: node launcher/build.mjs
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item launcher/LEEME.txt dist/
          Compress-Archive -Path dist/LootArena.exe, dist/LEEME.txt -DestinationPath ${{ matrix.nombre }}
      - name: Empaquetar (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cp launcher/LEEME.txt dist/
          cd dist && zip -9 ../${{ matrix.nombre }} LootArena LEEME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}

  html5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Al relanzar a mano, compila la etiqueta pedida (no main).
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/sync-config.mjs
      - name: Zip HTML5 (index.html en la raíz del zip)
        run: cd web && zip -9 -r ../LootArena-HTML5.zip . -x "test/*" "package*.json" "sync-config.mjs" "README.md"
      - uses: actions/upload-artifact@v4
        with:
          name: LootArena-HTML5.zip
          path: LootArena-HTML5.zip

  release:
    needs: [ejecutables, html5]
    # Publica aunque falle o se cancele algún sistema: sube los zip que haya.
    # Al relanzar el workflow, `gh release upload --clobber` añade los que falten.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Al relanzar a mano, compila la etiqueta pedida (no main).
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Crear o actualizar la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la paquetes || true
          if ! ls paquetes/*.zip >/dev/null 2>&1; then
            echo "::error::No hay ningún paquete que publicar"
            exit 1
          fi
          for f in LootArena-Windows.zip LootArena-macOS.zip LootArena-Linux.zip LootArena-HTML5.zip; do
            [ -f "paquetes/$f" ] || echo "::warning::Falta $f (su job falló o se canceló); se publica el resto"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" paquetes/* --clobber
          else
            gh release create "$TAG" paquetes/* --title "Loot Arena $TAG" --notes-file launcher/NOTAS_RELEASE.md
          fi
